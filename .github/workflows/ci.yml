name: Test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: prasittichoke:ci
      - name: Container smoke test
        run: |
          docker run -d --name smoke -e ADMIN_PASSWORD=ci-only-long-random-password -p 127.0.0.1:3000:3000 prasittichoke:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/healthz; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ghcr.io/sabaszx/prasittichotte:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/sabaszx/prasittichotte
